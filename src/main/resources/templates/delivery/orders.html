<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('My Deliveries')}"></head>
<link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="sl-dashboard-wrapper">
    <aside class="sl-sidebar">
        <div class="sidebar-header">
            <div style="font-family:var(--font-brand);font-size:1.2rem;color:var(--primary-light);">Spirit<span style="color:var(--accent);">Lane</span></div>
            <div class="sidebar-role-badge">Delivery Agent</div>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-item"><a th:href="@{/delivery/dashboard}" class="nav-link"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
            <li class="nav-item"><a th:href="@{/delivery/orders}" class="nav-link active"><i class="fas fa-motorcycle"></i>My Deliveries</a></li>
            <li class="nav-item">
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="nav-link w-100" style="background:none;border:none;text-align:left;cursor:pointer;">
                        <i class="fas fa-sign-out-alt"></i>Logout
                    </button>
                </form>
            </li>
        </ul>
    </aside>

    <div class="sl-dashboard-content">
        <div class="page-header">
            <h1><i class="fas fa-motorcycle me-2"></i>My Deliveries</h1>
        </div>
        <div th:replace="~{fragments :: alerts}"></div>

        <div class="table-container">
            <div class="table-header">
                <h3>All Assigned Orders (<span th:text="${orders.totalElements}"></span>)</h3>
            </div>
            <div style="overflow-x:auto;">
                <table class="sl-table">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Shop</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders.content}">
                            <td style="color:var(--primary-light);font-weight:700;font-size:0.82rem;"
                                th:text="${order.orderNumber}"></td>
                            <td>
                                <div th:text="${order.customer.fullName}"></div>
                                <div style="font-size:0.78rem;color:var(--text-muted);"
                                     th:text="${order.customer.phone}"></div>
                            </td>
                            <td style="font-size:0.85rem;" th:text="${order.shop.shopName}"></td>
                            <td style="font-weight:600;color:var(--primary-light);"
                                th:text="'₹' + ${order.totalAmount}"></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${'status-' + #strings.toLowerCase(#strings.replace(order.orderStatus.name(),'_','-'))}"
                                      th:text="${order.orderStatus}"></span>
                            </td>
                            <td style="font-size:0.82rem;color:var(--text-muted);"
                                th:text="${#temporals.format(order.createdAt,'dd MMM yyyy')}"></td>
                            <td>
                                <a th:href="@{/delivery/orders/{id}(id=${order.id})}"
                                   class="btn-outline-sl px-2 py-1" style="font-size:0.78rem;">Update</a>
                            </td>
                        </tr>
                        <tr th:if="${orders.totalElements == 0}">
                            <td colspan="7" class="text-center" style="color:var(--text-muted);padding:3rem;">
                                No deliveries assigned yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${orders.totalPages > 1}" class="sl-pagination p-3">
                <a th:if="${!orders.first}" th:href="@{/delivery/orders(page=${orders.number - 1})}" class="sl-page-btn"><i class="fas fa-chevron-left"></i></a>
                <th:block th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}">
                    <a th:if="${i >= orders.number - 2 and i <= orders.number + 2}"
                       th:href="@{/delivery/orders(page=${i})}" class="sl-page-btn"
                       th:classappend="${i == orders.number} ? ' active'" th:text="${i + 1}"></a>
                </th:block>
                <a th:if="${!orders.last}" th:href="@{/delivery/orders(page=${orders.number + 1})}" class="sl-page-btn"><i class="fas fa-chevron-right"></i></a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
