<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Register as Delivery Agent')}"></head>
<body>
<div th:replace="~{fragments :: toastContainer}"></div>
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-sm-11">
                <div class="auth-card">
                    <div class="auth-logo">Spirit<span>Lane</span></div>
                    <p class="auth-subtitle"><i class="fas fa-motorcycle me-1"></i>Register as Delivery Agent</p>

                    <div th:replace="~{fragments :: alerts}"></div>

                    <form th:action="@{/auth/register-agent}" th:object="${registrationDto}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:field="*{role}" value="ROLE_DELIVERY_AGENT"/>

                        <div class="sl-form-group">
                            <label class="sl-form-label"><i class="fas fa-user me-1"></i>Full Name</label>
                            <input type="text" th:field="*{fullName}"
                                   th:class="'sl-form-control' + (${#fields.hasErrors('fullName')} ? ' is-invalid' : '')"
                                   placeholder="Your full name" required/>
                            <span class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                        </div>

                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="sl-form-group">
                                    <label class="sl-form-label"><i class="fas fa-envelope me-1"></i>Email</label>
                                    <input type="email" th:field="*{email}"
                                           th:class="'sl-form-control' + (${#fields.hasErrors('email')} ? ' is-invalid' : '')"
                                           placeholder="your@email.com" required/>
                                    <span class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="sl-form-group">
                                    <label class="sl-form-label"><i class="fas fa-phone me-1"></i>Mobile</label>
                                    <input type="tel" th:field="*{phone}"
                                           th:class="'sl-form-control' + (${#fields.hasErrors('phone')} ? ' is-invalid' : '')"
                                           placeholder="10-digit number" maxlength="10" required/>
                                    <span class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                                </div>
                            </div>
                        </div>

                        <div class="sl-form-group">
                            <label class="sl-form-label"><i class="fas fa-birthday-cake me-1"></i>Date of Birth</label>
                            <input type="date" th:field="*{dateOfBirth}"
                                   th:class="'sl-form-control' + (${#fields.hasErrors('dateOfBirth')} ? ' is-invalid' : '')"
                                   required/>
                            <span class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
                        </div>

                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="sl-form-group">
                                    <label class="sl-form-label"><i class="fas fa-lock me-1"></i>Password</label>
                                    <input type="password" th:field="*{password}"
                                           th:class="'sl-form-control' + (${#fields.hasErrors('password')} ? ' is-invalid' : '')"
                                           placeholder="Min 8 characters" required/>
                                    <span class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="sl-form-group">
                                    <label class="sl-form-label"><i class="fas fa-lock me-1"></i>Confirm</label>
                                    <input type="password" th:field="*{confirmPassword}"
                                           class="sl-form-control" placeholder="Repeat password" required/>
                                </div>
                            </div>
                        </div>

                        <div class="sl-alert sl-alert-info">
                            <i class="fas fa-motorcycle"></i>
                            Join our delivery fleet and earn on every order you deliver!
                        </div>

                        <button type="submit" class="btn-primary-sl w-100 py-3 mt-2">
                            <i class="fas fa-motorcycle me-2"></i>Join as Delivery Agent
                        </button>
                    </form>

                    <div class="gold-divider"></div>
                    <p class="text-center" style="font-size:0.88rem;color:var(--text-muted);">
                        Already registered? <a th:href="@{/auth/login}" class="text-brand fw-bold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
