<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Reset Password')}"></head>
<body>
<div th:replace="~{fragments :: toastContainer}"></div>
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-10">
                <div class="auth-card">
                    <div class="auth-logo">Spirit<span>Lane</span></div>
                    <p class="auth-subtitle">
                        <i class="fas fa-lock me-1"></i>
                        Set a New Password
                    </p>

                    <div th:replace="~{fragments :: alerts}"></div>

                    <form th:action="@{/auth/reset-password}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="sl-form-group">
                            <label class="sl-form-label" for="newPassword">
                                <i class="fas fa-lock me-1"></i>New Password
                            </label>
                            <input type="password" id="newPassword" name="newPassword"
                                   class="sl-form-control" placeholder="Min 8 characters"
                                   minlength="8" required autocomplete="new-password"/>
                        </div>

                        <div class="sl-form-group">
                            <label class="sl-form-label" for="confirmPassword">
                                <i class="fas fa-lock me-1"></i>Confirm New Password
                            </label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   class="sl-form-control" placeholder="Repeat password"
                                   minlength="8" required autocomplete="new-password"/>
                        </div>

                        <button type="submit" class="btn-primary-sl w-100 py-3">
                            <i class="fas fa-check-circle me-2"></i>Reset Password
                        </button>
                    </form>

                    <div class="gold-divider"></div>

                    <p class="text-center" style="font-size:0.9rem;color:var(--text-muted);">
                        <a th:href="@{/auth/login}" class="text-brand fw-bold">Back to Login</a>
                    </p>
                </div>
                <div class="age-disclaimer mt-3">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    18+ only. Drinking alcohol is injurious to health.
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
