<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Forgot Password')}"></head>
<body>
<div th:replace="~{fragments :: toastContainer}"></div>
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-10">
                <div class="auth-card">
                    <div class="auth-logo">Spirit<span>Lane</span></div>
                    <p class="auth-subtitle">
                        <i class="fas fa-unlock-alt me-1"></i>
                        Forgot Password
                    </p>

                    <div th:replace="~{fragments :: alerts}"></div>

                    <p class="text-center" style="color:var(--text-muted);font-size:0.9rem;">
                        Enter your registered email address and we'll send you an OTP to reset your password.
                    </p>

                    <form th:action="@{/auth/forgot-password}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="sl-form-group">
                            <label class="sl-form-label" for="email">
                                <i class="fas fa-envelope me-1"></i>Email Address
                            </label>
                            <input type="email" id="email" name="email"
                                   class="sl-form-control" placeholder="your@email.com"
                                   required autocomplete="email"/>
                        </div>

                        <button type="submit" class="btn-primary-sl w-100 py-3">
                            <i class="fas fa-paper-plane me-2"></i>Send OTP
                        </button>
                    </form>

                    <div class="gold-divider"></div>

                    <p class="text-center" style="font-size:0.9rem;color:var(--text-muted);">
                        Remembered your password?
                        <a th:href="@{/auth/login}" class="text-brand fw-bold">Sign In</a>
                    </p>
                </div>
                <div class="age-disclaimer mt-3">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    18+ only. Drinking alcohol is injurious to health.
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
