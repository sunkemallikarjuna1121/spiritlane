<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Verify OTP')}"></head>
<body>
<div th:replace="~{fragments :: toastContainer}"></div>
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-10">
                <div class="auth-card">
                    <div class="auth-logo">Spirit<span>Lane</span></div>
                    <p class="auth-subtitle">
                        <i class="fas fa-envelope-open-text me-1"></i>
                        Email Verification
                    </p>

                    <div th:replace="~{fragments :: alerts}"></div>

                    <p class="text-center" style="color:var(--text-muted);font-size:0.9rem;">
                        We've sent a 6-digit OTP to
                        <strong style="color:var(--primary-light)" th:text="${maskedEmail}"></strong>.
                        Enter it below to
                        <span th:text="${purpose == 'FORGOT_PASSWORD'} ? 'continue resetting your password.' : 'complete your registration.'"></span>
                    </p>

                    <form th:action="@{/auth/verify-otp}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="sl-form-group">
                            <label class="sl-form-label"><i class="fas fa-key me-1"></i>Enter OTP</label>
                            <input type="text" name="otp" id="otpInput"
                                   class="sl-form-control text-center"
                                   style="letter-spacing:0.5rem;font-size:1.4rem;font-weight:700;"
                                   maxlength="6" inputmode="numeric" pattern="\d{6}"
                                   placeholder="------" autocomplete="one-time-code" required autofocus/>
                        </div>

                        <button type="submit" class="btn-primary-sl w-100 py-3">
                            <i class="fas fa-check-circle me-2"></i>Verify OTP
                        </button>
                    </form>

                    <div class="gold-divider"></div>

                    <form th:action="@{/auth/verify-otp/resend}" method="post" class="text-center">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.5rem;">
                            Didn't receive the OTP?
                        </p>
                        <button type="submit" class="btn-outline-sl px-4 py-2">
                            <i class="fas fa-redo me-1"></i>Resend OTP
                        </button>
                    </form>

                    <p class="text-center mt-3" style="font-size:0.85rem;color:var(--text-muted);">
                        <a th:href="@{/auth/login}" style="color:var(--text-muted);">
                            <i class="fas fa-arrow-left me-1"></i>Back to Login
                        </a>
                    </p>
                </div>
                <div class="age-disclaimer mt-3">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    OTP is valid for 10 minutes. Do not share it with anyone.
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
<script>
    // numeric-only, auto-strip non digits
    document.getElementById('otpInput').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });
</script>
</body>
</html>
