<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<div th:replace="~{fragments :: toastContainer}"></div>

<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-10">

                <div class="auth-card">
                    <!-- Logo -->
                    <div class="auth-logo">Spirit<span>Lane</span></div>
                    <p class="auth-subtitle">🍾 Premium Alcohol Home Delivery</p>

                    <!-- Alerts -->
                    <div th:replace="~{fragments :: alerts}"></div>

                    <!-- Login Form -->
                    <form th:action="@{/auth/login}" method="post" id="loginForm" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="sl-form-group">
                            <label class="sl-form-label" for="email">
                                <i class="fas fa-envelope me-1"></i>Email Address
                            </label>
                            <input type="email" id="email" name="email"
                                   class="sl-form-control" placeholder="your@email.com"
                                   required autocomplete="email"/>
                        </div>

                        <div class="sl-form-group">
                            <label class="sl-form-label" for="password">
                                <i class="fas fa-lock me-1"></i>Password
                            </label>
                            <div class="position-relative">
                                <input type="password" id="password" name="password"
                                       class="sl-form-control" placeholder="Enter your password"
                                       required autocomplete="current-password"/>
                                <button type="button" class="btn-toggle-pwd"
                                        onclick="togglePassword('password')"
                                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <label class="filter-checkbox">
                                <input type="checkbox" name="remember-me"/>
                                <span style="font-size:0.85rem;color:var(--text-muted)">Remember me</span>
                            </label>
                            <a href="#" style="font-size:0.85rem;color:var(--text-muted)">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-primary-sl w-100 py-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In
                        </button>
                    </form>

                    <div class="gold-divider"></div>

                    <p class="text-center" style="font-size:0.9rem;color:var(--text-muted);">
                        New to SpiritLane?
                        <a th:href="@{/auth/register}" class="text-brand fw-bold">Create Account</a>
                    </p>

                    <!-- Role-based register links -->
                    <div class="d-flex justify-content-center gap-3 mt-2 flex-wrap">
                        <a th:href="@{/auth/register-shop}"
                           style="font-size:0.8rem;color:var(--text-muted);">
                            <i class="fas fa-store me-1"></i>Register Shop
                        </a>
                        <span style="color:var(--border-color)">|</span>
                        <a th:href="@{/auth/register-agent}"
                           style="font-size:0.8rem;color:var(--text-muted);">
                            <i class="fas fa-motorcycle me-1"></i>Join as Agent
                        </a>
                    </div>
                </div>

                <div class="age-disclaimer mt-3">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    18+ only. Drinking alcohol is injurious to health.
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
<script>
    function togglePassword(fieldId) {
        var field = document.getElementById(fieldId);
        var icon  = document.getElementById('eyeIcon');
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
</body>
</html>
