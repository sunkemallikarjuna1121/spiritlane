<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Notifications')}"></head>
<body>
<div th:replace="~{fragments :: toastContainer}"></div>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="section-title mb-0">
            <i class="fas fa-bell me-2"></i>Notifications
        </h2>
        <a th:href="@{/customer/notifications}"
           style="font-size:0.85rem;color:var(--text-muted);">
            <i class="fas fa-check-double me-1"></i>Mark All Read
        </a>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
        <div style="font-size:5rem;">🔔</div>
        <h5 style="color:var(--text-muted);" class="mt-3">No notifications yet</h5>
        <p style="color:var(--text-muted);">You'll see order updates and promotions here.</p>
    </div>

    <!-- Notifications list -->
    <div th:unless="${#lists.isEmpty(notifications)}">
        <div th:each="notif : ${notifications}"
             class="sl-card mb-2"
             th:style="${!notif.isRead} ? 'border-color:var(--primary);background:rgba(200,134,10,0.05);' : ''">
            <div class="d-flex gap-3 align-items-start">

                <!-- Icon by type -->
                <div style="width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;"
                     th:style="${notif.type.name() == 'ORDER'}    ? 'background:rgba(200,134,10,0.2);' :
                               (${notif.type.name() == 'PAYMENT'} ? 'background:rgba(40,167,69,0.2);'  :
                               (${notif.type.name() == 'PROMO'}   ? 'background:rgba(255,107,43,0.2);' :
                                                                     'background:rgba(23,162,184,0.2);'))">
                    <i th:class="${notif.type.name() == 'ORDER'}    ? 'fas fa-box'         :
                                 (${notif.type.name() == 'PAYMENT'} ? 'fas fa-credit-card' :
                                 (${notif.type.name() == 'PROMO'}   ? 'fas fa-tag'         :
                                                                       'fas fa-bell'))"
                       th:style="${notif.type.name() == 'ORDER'}    ? 'color:var(--primary-light);' :
                                 (${notif.type.name() == 'PAYMENT'} ? 'color:#6ee08a;'              :
                                 (${notif.type.name() == 'PROMO'}   ? 'color:var(--accent);'        :
                                                                       'color:#17a2b8;'))"></i>
                </div>

                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <h6 style="color:var(--text-light);margin-bottom:0.2rem;font-size:0.92rem;"
                            th:text="${notif.title}"></h6>
                        <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0;">
                            <span th:unless="${notif.isRead}"
                                  style="width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;"></span>
                            <span style="font-size:0.75rem;color:var(--text-muted);white-space:nowrap;"
                                  th:text="${#temporals.format(notif.createdAt,'dd MMM, hh:mm a')}"></span>
                        </div>
                    </div>
                    <p style="color:var(--text-muted);font-size:0.87rem;margin-bottom:0;"
                       th:text="${notif.message}"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
