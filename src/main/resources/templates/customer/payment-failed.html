<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Payment Failed')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-5 text-center">
    <div class="sl-card mx-auto" style="max-width:520px;">
        <div style="font-size:5rem;margin-bottom:1rem;">❌</div>
        <h2 style="color:var(--danger);margin-bottom:0.5rem;">Payment Failed</h2>
        <p style="color:var(--text-muted);">Your payment could not be processed. Your order has been saved — you can retry payment from My Orders.</p>
        <div class="d-flex gap-3 justify-content-center mt-4 flex-wrap">
            <a th:href="@{/customer/orders}" class="btn-primary-sl px-4 py-2">
                <i class="fas fa-redo me-2"></i>Retry from Orders
            </a>
            <a th:href="@{/cart}" class="btn-outline-sl px-4 py-2">
                <i class="fas fa-shopping-cart me-2"></i>Back to Cart
            </a>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
