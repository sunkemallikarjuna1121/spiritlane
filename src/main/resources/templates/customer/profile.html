<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('My Profile')}"></head>
<body>
<div th:replace="~{fragments :: toastContainer}"></div>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container py-4">
    <h2 class="section-title"><i class="fas fa-user-circle me-2"></i>My Profile</h2>
    <div th:replace="~{fragments :: alerts}"></div>

    <div class="row g-4">
        <!-- Profile Details -->
        <div class="col-lg-6">
            <div class="sl-card">
                <h5 style="color:var(--primary-light);margin-bottom:1.2rem;">
                    <i class="fas fa-user me-2"></i>Personal Information
                </h5>
                <form th:action="@{/customer/profile/update}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="sl-form-group">
                        <label class="sl-form-label">Full Name</label>
                        <input type="text" name="fullName" class="sl-form-control"
                               th:value="${user.fullName}" required/>
                    </div>
                    <div class="sl-form-group">
                        <label class="sl-form-label">Email</label>
                        <input type="email" class="sl-form-control"
                               th:value="${user.email}" disabled
                               style="opacity:0.6;cursor:not-allowed;"/>
                        <small style="color:var(--text-muted);font-size:0.78rem;">Email cannot be changed</small>
                    </div>
                    <div class="sl-form-group">
                        <label class="sl-form-label">Mobile Number</label>
                        <input type="tel" name="phone" class="sl-form-control"
                               th:value="${user.phone}" maxlength="10" required/>
                    </div>
                    <div class="sl-form-group">
                        <label class="sl-form-label">Date of Birth</label>
                        <input type="date" class="sl-form-control"
                               th:value="${user.dateOfBirth}" disabled
                               style="opacity:0.6;cursor:not-allowed;"/>
                    </div>
                    <button type="submit" class="btn-primary-sl px-4 py-2">
                        <i class="fas fa-save me-2"></i>Update Profile
                    </button>
                </form>
            </div>
        </div>

        <!-- Change Password -->
        <div class="col-lg-6">
            <div class="sl-card">
                <h5 style="color:var(--primary-light);margin-bottom:1.2rem;">
                    <i class="fas fa-key me-2"></i>Change Password
                </h5>
                <form th:action="@{/customer/profile/change-password}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="sl-form-group">
                        <label class="sl-form-label">Current Password</label>
                        <input type="password" name="oldPassword" class="sl-form-control"
                               placeholder="Current password" required/>
                    </div>
                    <div class="sl-form-group">
                        <label class="sl-form-label">New Password</label>
                        <input type="password" name="newPassword" class="sl-form-control"
                               placeholder="Min 8 characters" required/>
                    </div>
                    <div class="sl-form-group">
                        <label class="sl-form-label">Confirm New Password</label>
                        <input type="password" name="confirmPassword" class="sl-form-control"
                               placeholder="Repeat new password" required/>
                    </div>
                    <button type="submit" class="btn-outline-sl px-4 py-2">
                        <i class="fas fa-lock me-2"></i>Change Password
                    </button>
                </form>
            </div>

            <!-- Account Info -->
            <div class="sl-card mt-3">
                <h5 style="color:var(--primary-light);margin-bottom:1rem;">
                    <i class="fas fa-info-circle me-2"></i>Account Info
                </h5>
                <div class="summary-row">
                    <span>Member Since</span>
                    <span th:text="${#temporals.format(user.createdAt,'dd MMM yyyy')}"></span>
                </div>
                <div class="summary-row">
                    <span>Age Verified</span>
                    <span th:if="${user.isAgeVerified}" style="color:var(--success);">
                        <i class="fas fa-check-circle me-1"></i>Yes
                    </span>
                    <span th:unless="${user.isAgeVerified}" style="color:var(--danger);">
                        <i class="fas fa-times-circle me-1"></i>No
                    </span>
                </div>
                <div class="summary-row">
                    <span>Account Status</span>
                    <span th:if="${user.isActive}" style="color:var(--success);">Active</span>
                </div>
                <div class="mt-3">
                    <a th:href="@{/customer/orders}" class="btn-outline-sl px-3 py-2" style="font-size:0.85rem;">
                        <i class="fas fa-box me-2"></i>View My Orders
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
