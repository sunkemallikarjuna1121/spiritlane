<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Shop Orders')}"></head>
<link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="sl-dashboard-wrapper">
    <aside class="sl-sidebar">
        <div class="sidebar-header">
            <div style="font-family:var(--font-brand);font-size:1.2rem;color:var(--primary-light);">Spirit<span style="color:var(--accent);">Lane</span></div>
            <div class="sidebar-role-badge">Shop Owner</div>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-item"><a th:href="@{/shop/dashboard}" class="nav-link"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
            <li class="nav-item"><a th:href="@{/shop/inventory}" class="nav-link"><i class="fas fa-boxes"></i>Inventory</a></li>
            <li class="nav-item"><a th:href="@{/shop/orders}" class="nav-link active"><i class="fas fa-box"></i>Orders</a></li>
            <li class="nav-item">
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="nav-link w-100" style="background:none;border:none;text-align:left;cursor:pointer;">
                        <i class="fas fa-sign-out-alt"></i>Logout
                    </button>
                </form>
            </li>
        </ul>
    </aside>

    <div class="sl-dashboard-content">
        <div class="page-header">
            <h1><i class="fas fa-box me-2"></i>Orders</h1>
        </div>

        <div th:replace="~{fragments :: alerts}"></div>

        <div class="table-container">
            <div class="table-header">
                <h3>All Orders (<span th:text="${orders.totalElements}"></span>)</h3>
                <input type="text" class="table-search" placeholder="Search orders..."
                       id="shopOrdSearch" onkeyup="filterTable('shopOrdSearch','shopOrdBody')"/>
            </div>
            <div style="overflow-x:auto;">
                <table class="sl-table">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Amount</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="shopOrdBody">
                        <tr th:each="order : ${orders.content}">
                            <td style="color:var(--primary-light);font-weight:700;font-size:0.82rem;"
                                th:text="${order.orderNumber}"></td>
                            <td>
                                <div th:text="${order.customer.fullName}"></div>
                                <div style="font-size:0.78rem;color:var(--text-muted);"
                                     th:text="${order.customer.phone}"></div>
                            </td>
                            <td style="font-size:0.85rem;"
                                th:text="${order.orderItems != null ? #lists.size(order.orderItems) : 0} + ' item(s)'"></td>
                            <td style="font-weight:600;color:var(--primary-light);"
                                th:text="'₹' + ${order.totalAmount}"></td>
                            <td>
                                <span th:if="${order.paymentStatus.name() == 'PAID'}"
                                      style="color:var(--success);font-size:0.82rem;font-weight:600;">
                                    <i class="fas fa-check-circle me-1"></i>Paid
                                </span>
                                <span th:unless="${order.paymentStatus.name() == 'PAID'}"
                                      style="color:#ffc107;font-size:0.82rem;"
                                      th:text="${order.paymentStatus}"></span>
                            </td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${'status-' + #strings.toLowerCase(#strings.replace(order.orderStatus.name(),'_','-'))}"
                                      th:text="${order.orderStatus}"></span>
                            </td>
                            <td style="font-size:0.82rem;color:var(--text-muted);"
                                th:text="${#temporals.format(order.createdAt,'dd MMM yyyy')}"></td>
                            <td>
                                <a th:href="@{/shop/orders/{id}(id=${order.id})}"
                                   class="btn-outline-sl px-2 py-1" style="font-size:0.78rem;">
                                    Manage
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${orders.totalElements == 0}">
                            <td colspan="8" class="text-center" style="color:var(--text-muted);padding:3rem;">
                                <div style="font-size:3rem;">📦</div>
                                <p class="mt-2">No orders received yet.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${orders.totalPages > 1}" class="sl-pagination p-3">
                <a th:if="${!orders.first}"
                   th:href="@{/shop/orders(page=${orders.number - 1})}"
                   class="sl-page-btn"><i class="fas fa-chevron-left"></i></a>
                <th:block th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}">
                    <a th:if="${i >= orders.number - 2 and i <= orders.number + 2}"
                       th:href="@{/shop/orders(page=${i})}"
                       class="sl-page-btn"
                       th:classappend="${i == orders.number} ? ' active'"
                       th:text="${i + 1}"></a>
                </th:block>
                <a th:if="${!orders.last}"
                   th:href="@{/shop/orders(page=${orders.number + 1})}"
                   class="sl-page-btn"><i class="fas fa-chevron-right"></i></a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
